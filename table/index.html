<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="루키의 식탁">
  <meta name="theme-color" content="#0b0d13">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon.svg">
  <title>🍽️ 루키의 식탁</title>
  <style>
    :root { --bg:#0b0d13; --panel:#141923; --card:#1b2230; --border:rgba(255,255,255,0.1); --accent:#10b981; --text:#f8fafc; --muted:#94a3b8; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif; background:var(--bg); color:var(--text); margin:0; height:100dvh; display:flex; flex-direction:column; overflow:hidden; }
    .login-wrap { max-width:420px; width:100%; margin:auto; padding:24px 18px; }
    .card { background:var(--panel); border:1px solid var(--border); border-radius:18px; padding:20px; }
    label { display:block; font-size:12px; color:var(--muted); margin:12px 0 5px 0; font-weight:600; }
    input, select, textarea { width:100%; background:#0b0e14; color:var(--text); border:1px solid var(--border); border-radius:10px; padding:10px 12px; font-size:14px; }
    .btn { background:var(--accent); color:#042f2e; border:none; border-radius:10px; padding:11px 14px; font-weight:700; font-size:14px; cursor:pointer; width:100%; margin-top:14px; text-decoration:none; display:inline-flex; justify-content:center; align-items:center; }
    .btn:disabled { opacity:0.55; cursor:not-allowed; }
    .btn-sm { background:rgba(255,255,255,0.07); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:5px 9px; font-size:11.5px; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:4px; white-space:nowrap; }
    .topbar { padding:calc(env(safe-area-inset-top,10px) + 8px) 12px 8px 12px; background:var(--panel); border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; gap:8px; flex-shrink:0; }
    .push-guide-bar { display:none; padding:8px 12px; background:rgba(245,158,11,0.14); border-bottom:1px solid rgba(245,158,11,0.35); color:#fcd34d; font-size:12px; align-items:center; justify-content:space-between; gap:8px; flex-shrink:0; }
    .app-body { flex:1; display:flex; min-height:0; position:relative; overflow:hidden; }
    .sidebar { width:280px; background:#0f131c; border-right:1px solid var(--border); display:flex; flex-direction:column; min-height:0; flex-shrink:0; }
    .sb-head { padding:10px; border-bottom:1px solid var(--border); display:flex; flex-direction:column; gap:8px; }
    .sb-btns { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
    .room-list { flex:1; overflow-y:auto; padding:8px; display:flex; flex-direction:column; gap:5px; }
    .r-item { display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:12px; cursor:pointer; border:1px solid transparent; background:rgba(255,255,255,0.02); }
    .r-item:hover { background:rgba(255,255,255,0.05); }
    .r-item.pinned { background:rgba(245,158,11,0.06); border-color:rgba(245,158,11,0.28); }
    .r-item.active { background:rgba(16,185,129,0.14); border-color:rgba(16,185,129,0.38); }
    .r-ava { width:38px; height:38px; border-radius:12px; background:var(--card); display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
    .r-main { flex:1; min-width:0; }
    .r-row1 { display:flex; justify-content:space-between; align-items:center; gap:6px; margin-bottom:3px; }
    .r-title-wrap { display:flex; align-items:center; gap:4px; min-width:0; flex:1; }
    .r-pin-mark { font-size:12px; flex-shrink:0; line-height:1; }
    .r-title { font-size:14px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .r-row1-right { display:inline-flex; align-items:center; gap:5px; flex-shrink:0; }
    .r-state { display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:700; border-radius:999px; padding:1px 7px; line-height:1.35; white-space:nowrap; max-width:116px; overflow:hidden; text-overflow:ellipsis; }
    .r-state.thinking { background:rgba(139,92,246,0.18); color:#c4b5fd; border:1px solid rgba(139,92,246,0.42); }
    .r-state.writing { background:rgba(16,185,129,0.18); color:#34d399; border:1px solid rgba(16,185,129,0.42); }
    .r-state-dot { width:5px; height:5px; border-radius:50%; background:currentColor; flex-shrink:0; animation:ltPulse 1.3s ease-in-out infinite; }
    @keyframes ltPulse { 0%,100%{opacity:0.35;transform:scale(0.85);} 50%{opacity:1;transform:scale(1.15);} }
    .r-pin-btn { background:transparent; border:1px solid transparent; border-radius:6px; padding:2px 5px; font-size:11.5px; line-height:1; cursor:pointer; opacity:0.35; color:var(--muted); flex-shrink:0; }
    .r-pin-btn:hover { opacity:0.85; background:rgba(255,255,255,0.07); }
    .r-pin-btn.active { opacity:1; color:#fbbf24; background:rgba(245,158,11,0.15); border-color:rgba(245,158,11,0.38); }
    .r-time { font-size:11px; color:var(--muted); flex-shrink:0; }
    .r-row2 { display:flex; justify-content:space-between; align-items:center; gap:6px; }
    .r-prev { font-size:12.5px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0; }
    .r-badge { background:#ef4444; color:#fff; font-size:10.5px; font-weight:800; border-radius:999px; padding:1px 6px; flex-shrink:0; }
    .chat-pane { flex:1; display:flex; flex-direction:column; min-width:0; min-height:0; }

    /* Default List-First Mode across ALL devices (mobile & desktop Safari) */
    #chatScreen.mode-list .sidebar { width:100%; max-width:680px; margin:0 auto; border-right:none; display:flex; position:static; }
    #chatScreen.mode-list .chat-pane { display:none; }
    #chatScreen.mode-list #toggleListBtn { display:none; }

    @media (max-width: 680px) {
      #chatScreen.mode-chat .sidebar { position:absolute; inset:0; width:100%; z-index:30; display:none; }
      #chatScreen.mode-chat .sidebar.open { display:flex; }
    }

    .msgs { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:11px; }
    .msg { display:flex; flex-direction:column; gap:3px; }
    .msg.mine { align-items:flex-end; }
    .msg.other, .msg.assistant { align-items:flex-start; }
    .meta { font-size:11px; color:var(--muted); display:flex; align-items:center; gap:5px; }
    .unread { color:#f59e0b; font-weight:800; font-size:10.5px; }
    .read-ok { color:#10b981; font-weight:700; font-size:10px; }
    .bubble { max-width:88%; padding:9px 13px; border-radius:12px; background:var(--card); border:1px solid var(--border); font-size:14px; line-height:1.56; white-space:pre-wrap; word-break:break-word; }
    .msg.mine .bubble { background:#1e293b; border-radius:12px 12px 4px 12px; }
    .msg.assistant .bubble { background:#111c24; border-color:rgba(16,185,129,0.4); width:100%; max-width:100%; }
    .composer { padding:8px 10px calc(env(safe-area-inset-bottom,10px) + 8px) 10px; background:var(--panel); border-top:1px solid var(--border); display:flex; flex-direction:column; gap:6px; }
    .comp-row { display:flex; gap:6px; align-items:flex-end; }
    .att-chip { display:inline-flex; align-items:center; gap:5px; font-size:11.5px; background:rgba(16,185,129,0.14); border:1px solid rgba(16,185,129,0.4); padding:3px 8px; border-radius:7px; margin-right:5px; cursor:pointer; }
    .att-chip.uploading { background:rgba(245,158,11,0.14); border-color:rgba(245,158,11,0.4); color:#fcd34d; cursor:default; }
    .att-box { margin-top:7px; display:flex; flex-direction:column; gap:8px; }
    .att-img-card { display:flex; flex-direction:column; gap:6px; align-items:flex-start; }
    .att-img-placeholder { min-width:160px; min-height:90px; padding:12px; border-radius:8px; border:1px dashed var(--border); background:rgba(255,255,255,0.03); color:var(--muted); font-size:12px; display:flex; align-items:center; justify-content:center; gap:6px; }
    .att-box img { max-width:min(260px, 74vw); max-height:320px; border-radius:9px; border:1px solid var(--border); display:block; cursor:pointer; object-fit:contain; background:#0b0e14; }
    .att-actions { display:flex; flex-wrap:wrap; gap:5px; align-items:center; }
    .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,0.72); z-index:60; display:none; align-items:center; justify-content:center; padding:16px; }
    .modal-bg.open { display:flex; }
    .chk-row { display:flex; align-items:center; gap:8px; padding:7px 0; font-size:13.5px; }
    .chk-row input { width:18px; height:18px; }

    /* Lightbox modal for full-screen image preview & Safari download/save */
    .lightbox-bg { position:fixed; inset:0; background:rgba(5,8,14,0.92); z-index:90; display:none; flex-direction:column; }
    .lightbox-bg.open { display:flex; }
    .lightbox-top { padding:calc(env(safe-area-inset-top,10px) + 10px) 14px 10px 14px; display:flex; justify-content:space-between; align-items:center; gap:8px; border-bottom:1px solid var(--border); background:rgba(15,20,30,0.85); }
    .lightbox-body { flex:1; display:flex; align-items:center; justify-content:center; padding:14px; overflow:auto; }
    .lightbox-body img { max-width:100%; max-height:100%; object-fit:contain; border-radius:8px; }
  </style>
</head>
<body>
  <div id="loginScreen" class="login-wrap">
    <div class="card">
      <h2 style="margin:0 0 6px 0;font-size:18px;">🍽️ 루키의 식탁 로그인</h2>
      <p style="margin:0 0 12px 0;font-size:12.5px;color:#94a3b8;line-height:1.5;">가족 입장 코드(<code>LTBL1:...</code> 또는 개인 초대 키 <code>ltok_...</code>)와 본인 비밀번호(PIN)로 로그인하세요. 홈 화면에 추가한 아이콘으로 열면 새 톡 알림을 실시간으로 받습니다.</p>
      <label>1. 식탁 입장 코드 (대소문자 무관 · ltok_ 키도 자동 인식)</label>
      <input id="inviteInput" type="text" placeholder="LTBL1:... 또는 ltok_... 코드 붙여넣기" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      <button class="btn-sm" id="loadMembersBtn" style="margin-top:8px;width:100%;justify-content:center;">가족 목록 불러오기</button>

      <label>2. 본인 이름 선택</label>
      <select id="memberSelect"><option value="">입장 코드를 붙여넣으면 자동으로 열립니다</option></select>

      <label>3. 개인 비밀번호 (PIN)</label>
      <input id="pinInput" type="password" inputmode="numeric" placeholder="개인 PIN 입력">

      <button class="btn" id="loginBtn">입장 및 알림 연결하기</button>
      <p id="loginOk" style="color:#34d399;font-size:12.5px;margin:10px 0 0 0;display:none;"></p>
      <p id="loginErr" style="color:#f87171;font-size:12.5px;margin:10px 0 0 0;"></p>
    </div>
  </div>

  <div id="chatScreen" class="mode-list" style="display:none;height:100%;flex-direction:column;">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:7px;min-width:0;">
        <button class="btn-sm" id="toggleListBtn">← 목록</button>
        <div style="font-weight:700;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"><span id="wsDot" style="color:#94a3b8;">●</span> <span id="curRoomTitleLbl">🍽️ 루키의 식탁 · 대화목록</span></div>
      </div>
      <div style="display:flex;gap:5px;flex-shrink:0;">
        <a class="btn-sm" id="openObsRoomBtn" href="obsidian://luki-table">📲 옵시디언창</a>
        <button class="btn-sm" id="pushSubBtn">🔔 푸시 켜기</button>
        <button class="btn-sm" id="logoutBtn">로그아웃</button>
      </div>
    </div>

    <div class="push-guide-bar" id="pushGuideBar">
      <span id="pushGuideTxt">🔔 잠금화면 알림을 받으려면 [푸시 켜기]를 한 번 눌러 허용해 주세요.</span>
      <button class="btn-sm" id="pushGuideActionBtn" style="border-color:rgba(245,158,11,0.5);color:#fef08a;">지금 켜기</button>
    </div>

    <div class="app-body">
      <div class="sidebar" id="roomSidebar">
        <div class="sb-head">
          <input id="roomSearchInp" type="text" placeholder="🔍 대화방 검색..." style="padding:8px 11px;font-size:13px;">
          <div class="sb-btns">
            <button class="btn-sm" id="newSoloBtn" style="justify-content:center;padding:7px 8px;">🪶 + 나·루키 1:1</button>
            <button class="btn-sm" id="newGroupBtn" style="justify-content:center;padding:7px 8px;">👥 + 가족 대화방</button>
          </div>
        </div>
        <div class="room-list" id="roomList"></div>
      </div>

      <div class="chat-pane">
        <div class="msgs" id="msgList"></div>
        <div class="composer">
          <div id="pendingAttBar" style="display:none;flex-wrap:wrap;gap:4px;"></div>
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div style="display:flex;gap:5px;align-items:center;flex-wrap:wrap;">
              <button class="btn-sm" id="lukiToggleBtn">🪶 @루키 부르기</button>
              <button class="btn-sm" id="attachBtn">📎 사진·문서</button>
              <button class="btn-sm" id="micBtn" type="button">🎙️ 음성 입력</button>
              <input type="file" id="filePicker" multiple style="display:none;" accept="image/*,.pdf,.txt,.md,.csv,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.hwp,.hwpx,.zip,.html">
            </div>
            <span id="typingLbl" style="font-size:11px;color:#34d399;"></span>
          </div>
          <div class="comp-row">
            <textarea id="chatInput" rows="2" placeholder="메시지 입력..." style="flex:1;resize:none;"></textarea>
            <button class="btn" id="sendBtn" style="width:auto;margin:0;padding:10px 15px;">전송</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-bg" id="newRoomModal">
    <div class="card" style="width:100%;max-width:380px;">
      <h3 id="modalTitle" style="margin:0 0 8px 0;font-size:16px;">새 대화방 열기</h3>
      <p id="modalDesc" style="margin:0 0 10px 0;font-size:12px;color:#94a3b8;line-height:1.45;"></p>
      <label>대화방 이름 (비워 두면 자동 생성)</label>
      <input id="newRoomTitleInp" type="text" placeholder="예: 말씀 묵상 노트 / 주말 모임">
      <div id="memberChkBox" style="margin-top:10px;max-height:180px;overflow-y:auto;"></div>
      <div style="display:flex;gap:8px;margin-top:14px;">
        <button class="btn-sm" id="cancelModalBtn" style="flex:1;justify-content:center;padding:10px;">취소</button>
        <button class="btn" id="confirmModalBtn" style="flex:2;margin:0;">대화방 열기</button>
      </div>
    </div>
  </div>

  <div class="lightbox-bg" id="imgLightbox">
    <div class="lightbox-top">
      <span id="lightboxName" style="font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">이미지 보기</span>
      <div style="display:flex;gap:6px;flex-shrink:0;">
        <button class="btn-sm" id="lightboxDlBtn" style="border-color:rgba(16,185,129,0.5);color:#6ee7b7;">📥 저장·다운로드</button>
        <button class="btn-sm" id="lightboxCloseBtn">✕ 닫기</button>
      </div>
    </div>
    <div class="lightbox-body" id="lightboxBody">
      <img id="lightboxImg" alt="">
    </div>
  </div>

  <script>
    const VIDEO_EXT_RE = /\.(mp4|mov|m4v|avi|mkv|webm|wmv|flv|mpeg|mpg|3gp|ogv|ts|mts|m2ts)$/i;
    const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent || '') || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    let state = {
      inviteCode: localStorage.getItem('lt_invite') || '',
      preferredMemberId: localStorage.getItem('lt_pref_member') || '',
      gatewayUrl: localStorage.getItem('lt_gw') || '',
      sessionToken: localStorage.getItem('lt_sess') || '',
      vapidPublicKey: localStorage.getItem('lt_vapid') || '',
      me: null,
      familyDirectory: [],
      rooms: [],
      viewMode: 'list',
      activeRoomId: '',
      roomSearch: '',
      ws: null,
      wsReconnectTimer: null,
      syncTimer: null,
      syncInFlight: false,
      invokeLuki: false,
      pinnedRoomIds: [],
      liveStreams: {},
      roomTypers: {},
      typerExpiryTimer: null,
      localTypingTimer: null,
      localTypingActiveRoom: '',
      lastTypingSentAt: 0,
      pendingAtts: [],
      uploadingCount: 0,
      modalSoloMode: false
    };

    const attBlobCache = new Map();     // `${roomId}:${attId}` -> { url, blob, name, mimeType }
    const attBlobInFlight = new Map();  // `${roomId}:${attId}` -> Promise
    let lightboxTarget = null;          // { roomId, att }

    function stripInvisible(str) {
      return String(str || '').replace(/[\u0000-\u001F\u007F-\u009F\u200B-\u200F\u202A-\u202E\u2060-\u206F\uFEFF]/g, '');
    }
    function hexToBytes(hex) {
      const out = new Uint8Array(hex.length / 2);
      for (let i = 0; i < out.length; i++) out[i] = parseInt(hex.substr(i * 2, 2), 16);
      return out;
    }
    function bytesToHex(bytes) {
      return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');
    }
    function b64uDecode(str) {
      const clean = String(str || '').replace(/[^A-Za-z0-9\-_+/=]/g, '').replace(/-/g, '+').replace(/_/g, '/');
      const pad = clean.length % 4 === 0 ? '' : '='.repeat(4 - (clean.length % 4));
      const bin = atob(clean + pad);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }
    function bytesEqual(a, b) {
      if (!a || !b || a.length !== b.length) return false;
      for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
      return true;
    }

    // Parse #invite=...&member=... hash link if opened from shared link
    (function consumeInviteHash() {
      try {
        const h = String(location.hash || '');
        const invM = h.match(/[?#&]invite=([^&]+)/i) || (location.search || '').match(/[?&]invite=([^&]+)/i);
        const memM = h.match(/[?#&]member=([^&]+)/i) || (location.search || '').match(/[?&]member=([^&]+)/i);
        if (invM && invM[1]) {
          state.inviteCode = decodeURIComponent(invM[1]).trim();
          localStorage.setItem('lt_invite', state.inviteCode);
        }
        if (memM && memM[1]) {
          state.preferredMemberId = decodeURIComponent(memM[1]).trim();
          localStorage.setItem('lt_pref_member', state.preferredMemberId);
        }
        if (invM) {
          const roomM = h.match(/room=([^&]+)/);
          const nextHash = roomM ? ('#room=' + roomM[1]) : '';
          history.replaceState(null, '', location.pathname + nextHash);
        }
      } catch (_) {}
    })();

    function normalizeUserCodeInput(rawInput) {
      let s = stripInvisible(rawInput).trim();
      if (!s) throw new Error('식탁 입장 코드(LTBL1:... 또는 ltok_...)를 붙여넣어 주세요.');
      try {
        if (s.includes('invite=')) {
          const mUrl = s.match(/invite=([^&\s#]+)/i);
          if (mUrl && mUrl[1]) s = decodeURIComponent(mUrl[1]).trim();
        }
      } catch (_) {}

      if (/ONH1\s*[:：]/i.test(s)) {
        throw new Error('입력하신 ONH1: 코드는 개인 알림함(/notify/) 전용 코드입니다. 옵시디언 [설정 ➔ 루키의 식탁] 맨 위의 입장 코드(LTBL1:... 또는 ltok_...)를 넣어 주세요.');
      }

      const ltblMatch = s.match(/ltbl1\s*[:：]\s*([A-Za-z0-9+/=_\-\s]+)/i);
      if (ltblMatch && ltblMatch[1]) {
        return { kind: 'ltbl1', canonical: 'LTBL1:' + ltblMatch[1].replace(/\s+/g, '') };
      }

      const ltokMatch = s.match(/(ltok_[A-Za-z0-9_-]{16,})/i);
      if (ltokMatch && ltokMatch[1]) {
        return { kind: 'ltok', canonical: ltokMatch[1].toLowerCase() };
      }

      const eyMatch = s.match(/(eyJ[A-Za-z0-9+/=_-]{30,})/);
      if (eyMatch && eyMatch[1]) {
        try {
          const obj = JSON.parse(new TextDecoder().decode(b64uDecode(eyMatch[1])));
          if (obj && (obj.t || obj.g)) return { kind: 'ltbl1', canonical: 'LTBL1:' + eyMatch[1] };
        } catch (_) {}
      }

      throw new Error('유효한 입장 코드를 찾지 못했습니다. 옵시디언 [설정 ➔ 루키의 식탁]에서 [입장 코드 복사]를 눌러 붙여넣어 주세요 (LTBL1:... 또는 ltok_... 모두 가능).');
    }

    async function decryptRawBeaconCiphertext(cipherStr, rawKeyBytes) {
      const s = String(cipherStr || '').trim();
      if (!s.startsWith('LUKIBEACON1:')) return null;
      const p = s.split(':');
      const iv = hexToBytes(p[1]), tag = hexToBytes(p[2]), ct = hexToBytes(p[3]);
      const comb = new Uint8Array(ct.length + tag.length);
      comb.set(ct, 0); comb.set(tag, ct.length);
      const ck = await crypto.subtle.importKey('raw', rawKeyBytes, { name: 'AES-GCM' }, false, ['decrypt']);
      return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, ck, comb)));
    }

    async function fetchStaticEncryptedBeaconDoc() {
      const candidates = [
        '../beacon.json?t=' + Date.now(),
        'https://law-g-on.github.io/obsidian-notify-hub/beacon.json?t=' + Date.now()
      ];
      for (const u of candidates) {
        try {
          const r = await fetch(u, { cache: 'no-store' });
          if (r.ok) {
            const j = await r.json();
            if (j && typeof j === 'object') return j;
          }
        } catch (_) {}
      }
      return null;
    }

    async function resolveGatewayFromInvite(rawInviteCode) {
      const parsed = normalizeUserCodeInput(rawInviteCode);
      let gw = '';

      if (parsed.kind === 'ltbl1') {
        let meta = null;
        try {
          meta = JSON.parse(new TextDecoder().decode(b64uDecode(parsed.canonical.slice(6))));
        } catch (_) {
          throw new Error('입장 코드 뒷부분이 중간에 잘렸습니다. 옵시디언 설정에서 [입장 코드 복사]를 다시 눌러 전체를 붙여넣어 주세요.');
        }
        gw = (meta.g || '').replace(/\/+$/, '');
        if (meta.k) {
          try {
            const bdoc = await fetchStaticEncryptedBeaconDoc();
            const ciph = bdoc && (bdoc.tableBeacon || bdoc.beacon || bdoc.message);
            if (ciph) {
              const dec = await decryptRawBeaconCiphertext(ciph, hexToBytes(meta.k));
              if (dec && dec.url) gw = dec.url.replace(/\/+$/, '');
            }
          } catch (_) {}
        }
      } else if (parsed.kind === 'ltok') {
        try {
          const enc = new TextEncoder();
          const topicHash = new Uint8Array(await crypto.subtle.digest('SHA-256', enc.encode('LUKI_TOK_TOPIC_V1|' + parsed.canonical)));
          const keyBytes = new Uint8Array(await crypto.subtle.digest('SHA-256', enc.encode('LUKI_TOK_KEY_V1|' + parsed.canonical)));
          const topic = 'luki-tok-beacon-' + bytesToHex(topicHash).slice(0, 24);
          const bdoc = await fetchStaticEncryptedBeaconDoc();
          const tokCiph = bdoc && bdoc.tokenBeacons && bdoc.tokenBeacons[topic];
          if (tokCiph) {
            const dec = await decryptRawBeaconCiphertext(tokCiph, keyBytes);
            if (dec && dec.url) {
              gw = dec.url.replace(/\/+$/, '');
              if (dec.memberId) {
                state.preferredMemberId = dec.memberId;
                localStorage.setItem('lt_pref_member', dec.memberId);
              }
              if (dec.inviteCode) state.canonicalInvite = dec.inviteCode;
            }
          }
        } catch (_) {}
        if (!gw && state.gatewayUrl) gw = state.gatewayUrl;
      }

      if (!gw) throw new Error('서버 연결 주소를 찾지 못했습니다. 잠시 후 다시 시도하거나 옵시디언 [입장 코드 복사]를 이용해 주세요.');
      state.gatewayUrl = gw;
      state.inviteCode = parsed.canonical;
      localStorage.setItem('lt_gw', gw);
      localStorage.setItem('lt_invite', parsed.canonical);
      return { gw, canonical: parsed.canonical, kind: parsed.kind };
    }

    async function apiFetch(path, opts = {}) {
      let gw = state.gatewayUrl;
      if (!gw && state.inviteCode) {
        const resolved = await resolveGatewayFromInvite(state.inviteCode);
        gw = resolved.gw;
      }
      const headers = Object.assign({}, opts.headers || {});
      if (state.sessionToken) headers['X-Table-Web-Session'] = state.sessionToken;
      if (opts.body && !headers['Content-Type']) headers['Content-Type'] = 'application/json';
      let res;
      try {
        res = await fetch(gw + path, Object.assign({}, opts, { headers }));
      } catch (e) {
        if (state.inviteCode) {
          const resolved = await resolveGatewayFromInvite(state.inviteCode);
          gw = resolved.gw;
          res = await fetch(gw + path, Object.assign({}, opts, { headers }));
        } else throw e;
      }
      return res;
    }

    async function ensureVapidPublicKey(forceRefresh = false) {
      if (state.vapidPublicKey && !forceRefresh) return state.vapidPublicKey;
      try {
        const r = await apiFetch('/table/ping');
        if (r.ok) {
          const d = await r.json();
          if (d && d.vapidPublicKey) {
            state.vapidPublicKey = String(d.vapidPublicKey).trim();
            localStorage.setItem('lt_vapid', state.vapidPublicKey);
            return state.vapidPublicKey;
          }
        }
      } catch (_) {}
      if (state.sessionToken) {
        try {
          const r2 = await apiFetch('/table/bootstrap?sinceSeq=0');
          if (r2.ok) {
            const d2 = await r2.json();
            if (d2 && d2.vapidPublicKey) {
              state.vapidPublicKey = String(d2.vapidPublicKey).trim();
              localStorage.setItem('lt_vapid', state.vapidPublicKey);
              return state.vapidPublicKey;
            }
          }
        } catch (_) {}
      }
      return state.vapidPublicKey || '';
    }

    async function refreshPushUiState() {
      const btn = document.getElementById('pushSubBtn');
      const bar = document.getElementById('pushGuideBar');
      const txt = document.getElementById('pushGuideTxt');
      const act = document.getElementById('pushGuideActionBtn');
      try {
        if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
          btn.textContent = '🔔 홈화면 추가 필요';
          txt.textContent = '📲 아이폰·휴대폰에서는 사파리 공유 메뉴의 [홈 화면에 추가]로 만든 바탕화면 아이콘에서 열어야 알림을 받습니다.';
          act.style.display = 'none';
          bar.style.display = 'flex';
          return;
        }
        const reg = await navigator.serviceWorker.getRegistration('./');
        const sub = reg ? await reg.pushManager.getSubscription() : null;
        if (typeof Notification !== 'undefined' && Notification.permission === 'granted' && sub) {
          btn.textContent = '🔔 알림 켜짐';
          btn.style.borderColor = 'rgba(16,185,129,0.5)';
          bar.style.display = 'none';
        } else if (typeof Notification !== 'undefined' && Notification.permission === 'denied') {
          btn.textContent = '🔕 알림 차단됨';
          txt.textContent = '⚠️ 기기 설정에서 이 웹앱의 알림이 꺼져 있습니다. 설정에서 알림을 허용한 뒤 [다시 연결]을 눌러 주세요.';
          act.textContent = '다시 연결';
          act.style.display = 'inline-flex';
          bar.style.display = 'flex';
        } else {
          btn.textContent = '🔔 푸시 켜기';
          btn.style.borderColor = '';
          txt.textContent = '🔔 실시간 잠금화면 알림이 아직 켜지지 않았습니다. 오른쪽 [지금 켜기]를 한 번 눌러 허용해 주세요!';
          act.textContent = '지금 켜기';
          act.style.display = 'inline-flex';
          bar.style.display = 'flex';
        }
      } catch (_) {}
    }

    async function subscribeTablePush(silent = false, existingPerm = '') {
      try {
        if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
          if (!silent) alert('사파리·크롬 공유 메뉴에서 [홈 화면에 추가]한 뒤 바탕화면 아이콘으로 열어 실행해 주세요.');
          await refreshPushUiState();
          return false;
        }
        let perm = existingPerm || (typeof Notification !== 'undefined' ? Notification.permission : 'default');
        if (perm !== 'granted') {
          perm = await Notification.requestPermission();
        }
        if (perm !== 'granted') {
          if (!silent) alert('알림 권한이 허용되지 않았습니다. 아이폰 [설정 ➔ 알림 ➔ 루키의 식탁]에서 알림을 허용해 주세요.');
          await refreshPushUiState();
          return false;
        }
        const vapidKey = await ensureVapidPublicKey(!state.vapidPublicKey);
        if (!vapidKey) {
          if (!silent) alert('서버의 푸시 인증 키를 불러오지 못했습니다. 잠시 후 다시 눌러 주세요.');
          await refreshPushUiState();
          return false;
        }
        const reg = await navigator.serviceWorker.register('./sw.js', { scope: './' });
        await navigator.serviceWorker.ready;
        const appKeyBytes = b64uDecode(vapidKey);
        let sub = await reg.pushManager.getSubscription();
        if (sub && sub.options && sub.options.applicationServerKey) {
          const curKeyBytes = new Uint8Array(sub.options.applicationServerKey);
          if (!bytesEqual(curKeyBytes, appKeyBytes)) {
            try { await sub.unsubscribe(); } catch (_) {}
            sub = null;
          }
        }
        if (!sub) {
          sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: appKeyBytes });
        }
        const sr = await apiFetch('/table/push/subscribe', {
          method: 'POST',
          body: JSON.stringify({ subscription: sub.toJSON(), userAgent: navigator.userAgent })
        });
        const sd = await sr.json().catch(() => ({ ok: sr.ok }));
        if (!sr.ok || !sd.ok) {
          throw new Error(sd.error || '서버 알림 등록에 실패했습니다.');
        }
        await refreshPushUiState();
        if (!silent) alert('✅ 참여 중인 방의 실시간 잠금화면 알림이 켜졌습니다!');
        return true;
      } catch (e) {
        await refreshPushUiState();
        if (!silent) alert('알림 설정 안내: ' + (e.message || e));
        return false;
      }
    }

    function computeUnread(room, m) {
      if (!room || room.isPrivateSolo) return 0;
      const mIds = (room.members || []).map(x => x.id || x);
      const reads = (m.readBy || []).filter(u => mIds.includes(u));
      return Math.max(0, mIds.length - reads.length);
    }

    function countMyUnreadInRoom(room) {
      if (!room || !state.me) return 0;
      if (state.viewMode === 'chat' && room.id === state.activeRoomId) return 0;
      let cnt = 0;
      for (const m of (room.messages || [])) {
        if (m.senderId === state.me.id) continue;
        if (!Array.isArray(m.readBy) || !m.readBy.includes(state.me.id)) cnt++;
      }
      return cnt;
    }

    function fmtRoomTime(ts) {
      if (!ts) return '';
      const d = new Date(ts);
      const now = new Date();
      if (d.toDateString() === now.toDateString()) {
        return d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
      }
      return (d.getMonth() + 1) + '. ' + d.getDate() + '.';
    }

    function syncTopbarRoomInfo() {
      let totalUnread = 0;
      for (const r of state.rooms) totalUnread += countMyUnreadInRoom(r);
      if (state.viewMode !== 'chat' || !state.activeRoomId) {
        document.getElementById('curRoomTitleLbl').textContent = totalUnread > 0
          ? ('🍽️ 루키의 식탁 · 대화목록 (' + totalUnread + ')')
          : '🍽️ 루키의 식탁 · 대화목록';
        document.getElementById('openObsRoomBtn').href = 'obsidian://luki-table';
        document.getElementById('toggleListBtn').textContent = '← 목록';
        return;
      }
      const room = state.rooms.find(r => r.id === state.activeRoomId);
      const rTitle = room ? (room.isPrivateSolo && room.title === '나의 식탁방' ? '🪶 나의 식탁방' : room.title) : '루키의 식탁';
      document.getElementById('curRoomTitleLbl').textContent = rTitle;
      document.getElementById('openObsRoomBtn').href = 'obsidian://luki-table' + (room ? ('?room=' + encodeURIComponent(room.id)) : '');
      document.getElementById('toggleListBtn').textContent = totalUnread > 0 ? ('← 목록 (' + totalUnread + ')') : '← 목록';
    }

    function applyReadCursorsToRoom(room, readCursors) {
      if (!room || room.isPrivateSolo || !readCursors || typeof readCursors !== 'object') return false;
      let changed = false;
      for (const [uid, maxSeq] of Object.entries(readCursors)) {
        const seqNum = Number(maxSeq || 0);
        if (seqNum <= 0) continue;
        for (const m of (room.messages || [])) {
          if ((m.seq || 0) > 0 && m.seq <= seqNum) {
            if (!Array.isArray(m.readBy)) m.readBy = [];
            if (!m.readBy.includes(uid)) {
              m.readBy.push(uid);
              changed = true;
            }
            const nextU = computeUnread(room, m);
            if (m.unreadCount !== nextU) {
              m.unreadCount = nextU;
              changed = true;
            }
          }
        }
      }
      return changed;
    }

    function upsertMessageInRoom(d) {
      if (!d || !d.roomId) return false;
      const r = state.rooms.find(x => x.id === d.roomId);
      if (!r) return false;
      if (!Array.isArray(r.messages)) r.messages = [];

      // If a human participant sent a message, they have obviously read all prior messages in this room
      if (!r.isPrivateSolo && d.role === 'user' && d.senderId && d.senderId !== 'luki') {
        for (const prev of r.messages) {
          if (d.seq && prev.seq && prev.seq > d.seq) continue;
          if (!Array.isArray(prev.readBy)) prev.readBy = [];
          if (!prev.readBy.includes(d.senderId)) prev.readBy.push(d.senderId);
          prev.unreadCount = computeUnread(r, prev);
        }
      }

      const idx = r.messages.findIndex(x => x.id === d.id || (d.clientMsgId && x.clientMsgId === d.clientMsgId));
      if (idx >= 0) {
        const prev = r.messages[idx];
        const mergedReads = Array.from(new Set([...(prev.readBy || []), ...(d.readBy || [])]));
        r.messages[idx] = Object.assign({}, prev, d, { readBy: mergedReads });
        r.messages[idx].unreadCount = computeUnread(r, r.messages[idx]);
      } else {
        const copy = Object.assign({}, d, { readBy: Array.isArray(d.readBy) ? d.readBy.slice() : [] });
        copy.unreadCount = computeUnread(r, copy);
        r.messages.push(copy);
        r.messages.sort((a, b) => (a.seq || a.createdAt || 0) - (b.seq || b.createdAt || 0));
      }
      try {
        const recentToKeep = r.messages.slice(-45);
        localStorage.setItem('lt_room_msgs_' + r.id, JSON.stringify(recentToKeep));
        if (r.messages.length > 24) {
          const older = r.messages.slice(0, -16).map(m => (m.role === 'assistant' ? '루키' : m.senderName) + ': ' + String(m.text || '').replace(/\s+/g, ' ').slice(0, 70)).join(' / ').slice(-1200);
          if (older) localStorage.setItem('lt_room_summary_' + r.id, older);
        }
      } catch (_) {}
      return true;
    }

    function sendReadForActiveRoom(forceScrollBottom = false) {
      syncTopbarRoomInfo();
      if (state.viewMode !== 'chat' || !state.activeRoomId) return;
      const room = state.rooms.find(r => r.id === state.activeRoomId);
      if (!room || room.isPrivateSolo || document.visibilityState === 'hidden') {
        renderMessages(forceScrollBottom);
        return;
      }
      let maxSeq = 0, maxTs = 0;
      for (const m of (room.messages || [])) {
        if (!Array.isArray(m.readBy)) m.readBy = [];
        if (state.me && !m.readBy.includes(state.me.id)) m.readBy.push(state.me.id);
        m.unreadCount = computeUnread(room, m);
        if ((m.seq || 0) > maxSeq) maxSeq = m.seq;
        if ((m.createdAt || 0) > maxTs) maxTs = m.createdAt || 0;
      }
      if (!sendWsJson({ type: 'read', roomId: room.id, upToSeq: maxSeq, upToCreatedAt: maxTs, isViewing: true })) {
        apiFetch('/table/read', { method: 'POST', body: JSON.stringify({ roomId: room.id, upToSeq: maxSeq, upToCreatedAt: maxTs }) }).catch(() => {});
      }
      renderRooms();
      renderMessages(forceScrollBottom);
    }

    function getPinStorageKey() {
      return 'lt_pins_' + (state.me?.id || state.preferredMemberId || 'default');
    }
    function savePinnedRoomsLocal() {
      try { localStorage.setItem(getPinStorageKey(), JSON.stringify(state.pinnedRoomIds || [])); } catch (_) {}
    }
    function loadPinnedRoomsLocal() {
      try {
        const raw = localStorage.getItem(getPinStorageKey());
        if (raw) {
          const arr = JSON.parse(raw);
          if (Array.isArray(arr)) state.pinnedRoomIds = arr.filter(Boolean);
        }
      } catch (_) {}
    }
    function isRoomPinned(roomId) {
      return Array.isArray(state.pinnedRoomIds) && state.pinnedRoomIds.includes(roomId);
    }
    async function togglePinRoom(roomId) {
      const nextPinned = !isRoomPinned(roomId);
      const cur = Array.isArray(state.pinnedRoomIds) ? state.pinnedRoomIds.slice() : [];
      state.pinnedRoomIds = nextPinned ? [roomId, ...cur.filter(x => x !== roomId)] : cur.filter(x => x !== roomId);
      savePinnedRoomsLocal();
      renderRooms();
      if (!sendWsJson({ type: 'pin_room', roomId, pinned: nextPinned })) {
        apiFetch('/table/rooms/pin', { method: 'POST', body: JSON.stringify({ roomId, pinned: nextPinned }) }).catch(() => {});
      }
    }
    function getActiveRoomTypers(roomId) {
      const map = state.roomTypers[roomId];
      if (!map) return [];
      const now = Date.now();
      const out = [];
      for (const [mid, info] of Object.entries(map)) {
        if (info && info.expiresAt > now) out.push(info.name || mid);
        else delete map[mid];
      }
      return out;
    }
    function scheduleWebTyperCleanup() {
      if (state.typerExpiryTimer) clearTimeout(state.typerExpiryTimer);
      const now = Date.now();
      let earliest = Infinity;
      for (const map of Object.values(state.roomTypers)) {
        for (const [mid, info] of Object.entries(map || {})) {
          if (!info || info.expiresAt <= now) delete map[mid];
          else if (info.expiresAt < earliest) earliest = info.expiresAt;
        }
      }
      if (earliest < Infinity) {
        state.typerExpiryTimer = setTimeout(() => {
          state.typerExpiryTimer = null;
          renderRooms();
          scheduleWebTyperCleanup();
        }, Math.max(150, earliest - now + 80));
      }
    }
    function resolveWebRoomLiveState(r) {
      const st = state.liveStreams[r.id];
      if (st) {
        const isWriting = st.phase === 'writing' || Boolean(String(st.text || '').trim());
        return isWriting
          ? { phase: 'writing', label: r.isPrivateSolo ? '✍️ 작성중' : '✍️ 루키 작성중' }
          : { phase: 'thinking', label: r.isPrivateSolo ? '💭 생각중' : '💭 루키 생각중' };
      }
      const typers = getActiveRoomTypers(r.id);
      if (typers.length > 0) {
        const label = (r.members || []).length <= 2
          ? ('✍️ ' + typers[0] + ' 작성중')
          : ('✍️ ' + typers[0] + (typers.length > 1 ? (' 외 ' + (typers.length - 1)) : '') + ' 작성중');
        return { phase: 'writing', label };
      }
      const chatInp = document.getElementById('chatInput');
      if (state.activeRoomId === r.id && chatInp && chatInp.value.trim().length > 0) {
        return { phase: 'writing', label: '✍️ 작성중' };
      }
      return null;
    }

    function renderRooms() {
      syncTopbarRoomInfo();
      const box = document.getElementById('roomList');
      box.innerHTML = '';
      const sorted = state.rooms.slice().sort((a, b) => {
        const pa = isRoomPinned(a.id);
        const pb = isRoomPinned(b.id);
        if (pa !== pb) return pa ? -1 : 1;
        const la = (a.messages && a.messages.length) ? (a.messages[a.messages.length - 1].createdAt || 0) : 0;
        const lb = (b.messages && b.messages.length) ? (b.messages[b.messages.length - 1].createdAt || 0) : 0;
        if (lb !== la) return lb - la;
        return 0;
      });
      for (const r of sorted) {
        const dispTitle = r.isPrivateSolo && r.title === '나의 식탁방' ? '나의 식탁방 (1:1)' : r.title;
        if (state.roomSearch && !dispTitle.toLowerCase().includes(state.roomSearch)) continue;
        const pinned = isRoomPinned(r.id);
        const lastM = (r.messages && r.messages.length) ? r.messages[r.messages.length - 1] : null;
        const unreadCnt = countMyUnreadInRoom(r);
        const ava = r.isPrivateSolo ? '🪶' : (r.type === 'living' ? '🏠' : ((r.members || []).length <= 2 ? '💬' : '👥'));
        const attPreview = (lastM && Array.isArray(lastM.attachments) && lastM.attachments.length > 0)
          ? ('📎 ' + lastM.attachments[0].name)
          : '';
        // Never overwrite last message preview with thinking/writing status!
        const prevTxt = lastM
          ? ((lastM.role === 'assistant' ? '루키: ' : (lastM.senderName + ': ')) + (String(lastM.text || '').replace(/==([^=]+)==/g, '$1').replace(/\s+/g, ' ').trim() || attPreview || '첨부파일').slice(0, 44))
          : (r.isPrivateSolo ? '나와 루키의 일대일 대화방' : '대화를 시작해 보세요');
        const liveState = resolveWebRoomLiveState(r);

        const item = document.createElement('div');
        item.className = 'r-item'
          + (pinned ? ' pinned' : '')
          + (state.viewMode === 'chat' && r.id === state.activeRoomId ? ' active' : '');
        item.innerHTML = '<div class="r-ava">' + ava + '</div>'
          + '<div class="r-main">'
          +   '<div class="r-row1">'
          +     '<div class="r-title-wrap">' + (pinned ? '<span class="r-pin-mark">📌</span>' : '') + '<span class="r-title"></span></div>'
          +     '<div class="r-row1-right"><span class="r-state-slot"></span><span class="r-time"></span><button type="button" class="r-pin-btn' + (pinned ? ' active' : '') + '" title="' + (pinned ? '상단 고정 해제' : '상단에 고정') + '">📌</button></div>'
          +   '</div>'
          +   '<div class="r-row2"><span class="r-prev"></span>' + (unreadCnt > 0 ? ('<span class="r-badge">' + unreadCnt + '</span>') : '') + '</div>'
          + '</div>';
        item.querySelector('.r-title').textContent = dispTitle;
        item.querySelector('.r-time').textContent = lastM ? fmtRoomTime(lastM.createdAt) : '';
        item.querySelector('.r-prev').textContent = prevTxt;
        if (liveState) {
          const stSlot = item.querySelector('.r-state-slot');
          const pill = document.createElement('span');
          pill.className = 'r-state ' + (liveState.phase === 'thinking' ? 'thinking' : 'writing');
          const dot = document.createElement('span');
          dot.className = 'r-state-dot';
          const lbl = document.createElement('span');
          lbl.textContent = liveState.label;
          pill.append(dot, lbl);
          stSlot.appendChild(pill);
        }
        const pinBtn = item.querySelector('.r-pin-btn');
        pinBtn.onclick = (ev) => {
          ev.stopPropagation();
          togglePinRoom(r.id);
        };
        item.onclick = () => openRoom(r.id);
        box.appendChild(item);
      }
    }

    async function fetchAttachmentBlob(roomId, att) {
      const key = roomId + ':' + att.id;
      if (attBlobCache.has(key)) return attBlobCache.get(key);
      if (attBlobInFlight.has(key)) return attBlobInFlight.get(key);
      const p = (async () => {
        const r = await apiFetch('/table/attachment?roomId=' + encodeURIComponent(roomId) + '&attId=' + encodeURIComponent(att.id));
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const blob = await r.blob();
        const url = URL.createObjectURL(blob);
        const entry = { url, blob, name: att.name || 'file', mimeType: att.mimeType || blob.type || 'application/octet-stream' };
        attBlobCache.set(key, entry);
        return entry;
      })();
      attBlobInFlight.set(key, p);
      try {
        return await p;
      } finally {
        attBlobInFlight.delete(key);
      }
    }

    async function downloadOrShareAttachment(roomId, att) {
      try {
        const entry = await fetchAttachmentBlob(roomId, att);
        const fileName = att.name || entry.name || 'attachment';
        const mime = att.mimeType || entry.mimeType || 'application/octet-stream';

        // On iOS Safari / PWA, Web Share API with File opens native "Save Image / Save to Files" sheet!
        if (IS_IOS && typeof File !== 'undefined' && navigator.share && navigator.canShare) {
          try {
            const fObj = new File([entry.blob], fileName, { type: mime });
            if (navigator.canShare({ files: [fObj] })) {
              await navigator.share({ files: [fObj], title: fileName });
              return;
            }
          } catch (shErr) {
            if (shErr && shErr.name === 'AbortError') return;
          }
        }

        // Standard direct download (macOS Safari, Chrome, Edge, Android)
        const dlUrl = URL.createObjectURL(entry.blob);
        const link = document.createElement('a');
        link.href = dlUrl;
        link.download = fileName;
        link.rel = 'noopener';
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => { try { URL.revokeObjectURL(dlUrl); } catch (_) {} }, 15000);
      } catch (e) {
        alert('파일을 내려받지 못했습니다: ' + (e.message || e));
      }
    }

    function isNearBottom(box) {

    function renderMessages(forceScrollBottom = false) {
      if (state.viewMode !== 'chat' || !state.activeRoomId) return;

      const room = state.rooms.find(r => r.id === state.activeRoomId);

        if (mine) {

          }

        const bub = document.createElement('div');

            if (a.isImage) {

              const cached = attBlobCache.get(key);

              const mountImg = (urlStr) => {
                card.innerHTML = '';
                const im = document.createElement('img');
                im.alt = a.name || '이미지';
                im.src = urlStr;
                im.onload = () => {
                  if (keepBottom) box.scrollTop = box.scrollHeight;
                };
                im.onclick = () => openImageLightbox(room.id, a, urlStr);

                acts.className = 'att-actions';

                zoomBtn.className = 'btn-sm';
                zoomBtn.textContent = '🔍 크게 보기';
                zoomBtn.onclick = () => openImageLightbox(room.id, a, urlStr);
                const dlBtn = document.createElement('button');
                dlBtn.className = 'btn-sm';
                dlBtn.textContent = '📥 저장·다운로드';
                dlBtn.onclick = () => downloadOrShareAttachment(room.id, a);
                acts.append(zoomBtn, dlBtn);
                card.append(im, acts);
              };

              if (cached) {
                mountImg(cached.url);
              } else {
                const ph = document.createElement('div');
                ph.className = 'att-img-placeholder';
                ph.textContent = '🖼️ 사진 불러오는 중...';
                card.appendChild(ph);
                fetchAttachmentBlob(room.id, a).then((entry) => {
                  if (!card.isConnected) return;
                  mountImg(entry.url);
                  if (keepBottom) box.scrollTop = box.scrollHeight;
                }).catch(() => {
                  if (!card.isConnected) return;
                  ph.textContent = '';
                  const retryBtn = document.createElement('button');
                  retryBtn.className = 'btn-sm';
                  retryBtn.textContent = '🔄 사진 다시 불러오기 (' + (a.name || '이미지') + ')';
                  retryBtn.onclick = () => {
                    ph.textContent = '🖼️ 다시 불러오는 중...';
                    fetchAttachmentBlob(room.id, a).then((entry) => {
                      if (card.isConnected) mountImg(entry.url);
                    }).catch(() => { ph.textContent = '⚠️ 사진을 불러오지 못했습니다.'; });
                  };
                  ph.appendChild(retryBtn);
                });
              }
              ab.appendChild(card);
            } else {
              const dl = document.createElement('button');
              dl.className = 'btn-sm';
              dl.textContent = '📄 ' + a.name + ' 내려받기';
              dl.onclick = () => downloadOrShareAttachment(room.id, a);
              ab.appendChild(dl);
            }
          }
          bub.appendChild(ab);

        wrap.append(meta, bub);
        box.appendChild(wrap);

      const st = state.liveStreams[room.id];
      if (st) {

        meta.className = 'meta';

        const bub = document.createElement('div');
        bub.className = 'bubble';
        if (st.thoughtPreview) {
          const thEl = document.createElement('div');
          thEl.style.cssText = 'font-size:11.5px;opacity:0.75;margin-bottom:6px;white-space:pre-wrap;border-left:2px solid rgba(120,120,140,0.4);padding-left:6px;';
          thEl.textContent = '💭 ' + String(st.thoughtPreview).slice(-260);
          bub.appendChild(thEl);
        }
        const bodySpan = document.createElement('div');
        bodySpan.style.whiteSpace = 'pre-wrap';
        bodySpan.textContent = st.text || '⋯';
        bub.appendChild(bodySpan);
        wrap.append(meta, bub);
        box.appendChild(wrap);
      }
      box.scrollTop = keepBottom ? box.scrollHeight : prevScrollTop;

    async function syncTableStateFromServer(silent = true) {
      if (!state.sessionToken || state.syncInFlight) return false;
      state.syncInFlight = true;
      try {
        const r = await apiFetch('/table/bootstrap?sinceSeq=0');
        const d = await r.json();
        if (!d || !d.ok) return false;
        if (d.me) state.me = d.me;
        if (Array.isArray(d.familyDirectory)) state.familyDirectory = d.familyDirectory;
        if (Array.isArray(d.pinnedRoomIds)) {
          state.pinnedRoomIds = d.pinnedRoomIds;
          savePinnedRoomsLocal();
        }
        if (d.vapidPublicKey) {
          state.vapidPublicKey = d.vapidPublicKey;
          localStorage.setItem('lt_vapid', d.vapidPublicKey);
        }

        const serverRooms = Array.isArray(d.rooms) ? d.rooms : [];
        let changed = false;
        for (const sr of serverRooms) {
          let lr = state.rooms.find(x => x.id === sr.id);
          if (!lr) {
            lr = Object.assign({}, sr, { messages: Array.isArray(sr.messages) ? sr.messages : [] });
            state.rooms.push(lr);
            changed = true;
          } else {
            lr.title = sr.title;
            lr.members = sr.members || lr.members;
            lr.paused = sr.paused;
            for (const sm of (sr.messages || [])) {
              const prevIdx = (lr.messages || []).findIndex(x => x.id === sm.id);
              if (prevIdx < 0) {
                upsertMessageInRoom(sm);
                changed = true;
              } else {
                const pm = lr.messages[prevIdx];
                const mergedReads = Array.from(new Set([...(pm.readBy || []), ...(sm.readBy || [])]));
                if (mergedReads.length !== (pm.readBy || []).length) {
                  pm.readBy = mergedReads;
                  pm.unreadCount = computeUnread(lr, pm);
                  changed = true;
                }
                if ((!pm.attachments || pm.attachments.length === 0) && Array.isArray(sm.attachments) && sm.attachments.length > 0) {
                  pm.attachments = sm.attachments;
                  changed = true;
                }
              }
            }
          }
          if (applyReadCursorsToRoom(lr, sr.readCursors)) changed = true;
          if (Array.isArray(sr.activeTypers)) {
            const now = Date.now();
            const map = {};
            for (const tp of sr.activeTypers) {
              if (tp && tp.memberId && tp.memberId !== state.me?.id && tp.expiresAt > now) {
                map[tp.memberId] = { name: tp.memberName || tp.memberId, expiresAt: tp.expiresAt };
              }
            }
            state.roomTypers[lr.id] = map;
            scheduleWebTyperCleanup();
          }
          if (sr.activeAssistantStream) {
            const prev = state.liveStreams[lr.id] || {};
            const srvText = String(sr.activeAssistantStream.text || '');
            const prevText = String(prev.text || '');
            const srvThought = String(sr.activeAssistantStream.thoughtPreview || '');
            const prevThought = String(prev.thoughtPreview || '');
            state.liveStreams[lr.id] = {
              msgId: sr.activeAssistantStream.msgId || prev.msgId || '',
              phase: sr.activeAssistantStream.phase || (srvText.trim() ? 'writing' : 'thinking'),
              status: sr.activeAssistantStream.status || '루키가 생각을 정리하고 있어요...',
              text: srvText.length >= prevText.length ? srvText : prevText,
              thoughtPreview: srvThought.length >= prevThought.length ? srvThought : prevThought
            };
            changed = true;
          } else if (state.liveStreams[lr.id]) {
            delete state.liveStreams[lr.id];
            changed = true;
          }
        }

        if (changed || !silent) {
          renderRooms();
          if (state.viewMode === 'chat' && state.activeRoomId) {
            renderMessages(false);
          }
        }
        if (state.viewMode === 'chat' && state.activeRoomId && document.visibilityState === 'visible') {
          sendReadForActiveRoom(false);
        }
        return true;
      } catch (_) {
        return false;
      } finally {
        state.syncInFlight = false;
      }
    }

    async function connectWs() {
      if (!state.sessionToken || !state.gatewayUrl) return;
      if (state.ws && state.ws.readyState <= 1) return;
      const wsBase = state.gatewayUrl.replace(/^http/, 'ws');
      const activeParam = (state.viewMode === 'chat' && state.activeRoomId) ? ('&activeRoom=' + encodeURIComponent(state.activeRoomId)) : '';
      let authQuery = 'session=' + encodeURIComponent(state.sessionToken);
      try {
        const tr = await apiFetch('/table/ws-ticket', { method: 'POST', body: '{}' });
        if (tr.ok) {
          const td = await tr.json();
          if (td && td.ok && td.ticket) authQuery = 'ticket=' + encodeURIComponent(td.ticket);
        }
      } catch (_) {}
      const ws = new WebSocket(wsBase + '/table/ws?' + authQuery + activeParam);
      state.ws = ws;
      ws.onopen = () => {
        document.getElementById('wsDot').style.color = '#10b981';
        if (state.viewMode === 'chat' && state.activeRoomId && document.visibilityState === 'visible') {
          sendWsJson({ type: 'active_room', roomId: state.activeRoomId });
        }
        // Always catch up missed messages & read receipts after reconnect (critical on iOS PWA!)
        syncTableStateFromServer(true);
      };
      ws.onclose = () => {
        document.getElementById('wsDot').style.color = '#94a3b8';
        if (state.wsReconnectTimer) clearTimeout(state.wsReconnectTimer);
        state.wsReconnectTimer = setTimeout(() => {
          if (state.sessionToken) connectWs();
        }, 2500);
      };
      ws.onmessage = (ev) => {
        try {
          const pkt = JSON.parse(ev.data);
          const d = pkt.data;
          if (pkt.event === 'room_created') {
            if (!state.rooms.find(x => x.id === d.id)) {
              state.rooms.push(d);
              renderRooms();
            }
          } else if (pkt.event === 'room_pin_updated') {
            if (Array.isArray(d.pinnedRoomIds)) {
              state.pinnedRoomIds = d.pinnedRoomIds;
              savePinnedRoomsLocal();
              renderRooms();
            }
          } else if (pkt.event === 'assistant_start') {
            state.liveStreams[d.roomId] = { phase: 'thinking', status: d.status || '루키가 생각을 정리하고 있어요...', text: '' };
            renderRooms();
            if (state.viewMode === 'chat' && d.roomId === state.activeRoomId) renderMessages(false);
          } else if (pkt.event === 'assistant_stream') {
            const prevPhase = state.liveStreams[d.roomId]?.phase || '';
            const nextPhase = d.phase || (String(d.text || '').trim() ? 'writing' : 'thinking');
            state.liveStreams[d.roomId] = { msgId: d.msgId || '', phase: nextPhase, status: d.status, text: d.text || '', thoughtPreview: d.thoughtPreview || '' };
            if (prevPhase !== nextPhase) renderRooms();
            if (state.viewMode === 'chat' && d.roomId === state.activeRoomId) renderMessages(false);
          } else if (pkt.event === 'assistant_error') {
            delete state.liveStreams[d.roomId];
            renderRooms();
            if (state.viewMode === 'chat' && d.roomId === state.activeRoomId) renderMessages(false);
          } else if (pkt.event === 'message') {
            delete state.liveStreams[d.roomId];
            if (d.senderId && state.roomTypers[d.roomId]) delete state.roomTypers[d.roomId][d.senderId];
            if (upsertMessageInRoom(d)) {
              renderRooms();
              if (state.viewMode === 'chat' && d.roomId === state.activeRoomId && document.visibilityState === 'visible') {
                sendReadForActiveRoom(false);
              } else if (state.viewMode === 'chat' && d.roomId === state.activeRoomId) {
                renderMessages(false);
              }
            }
          } else if (pkt.event === 'read_receipt') {
            const r = state.rooms.find(x => x.id === d.roomId);
            if (r) {
              const upToSeq = Number(d.upToSeq || 0);
              const upToTs = Number(d.upToCreatedAt || 0);
              for (const m of (r.messages || [])) {
                if (upToSeq > 0 && (m.seq || 0) > 0 && m.seq > upToSeq) {
                  if (!upToTs || (m.createdAt || 0) > upToTs) continue;
                }
                if (!Array.isArray(m.readBy)) m.readBy = [];
                if (!m.readBy.includes(d.memberId)) m.readBy.push(d.memberId);
                m.unreadCount = computeUnread(r, m);
              }
              renderRooms();
              if (state.viewMode === 'chat' && r.id === state.activeRoomId) renderMessages(false);
            }
          } else if (pkt.event === 'typing') {
            if (d.memberId && d.memberId !== state.me?.id) {
              if (!state.roomTypers[d.roomId]) state.roomTypers[d.roomId] = {};
              if (d.isTyping) {
                state.roomTypers[d.roomId][d.memberId] = { name: d.memberName || d.memberId, expiresAt: Date.now() + 5200 };
                scheduleWebTyperCleanup();
              } else {
                delete state.roomTypers[d.roomId][d.memberId];
              }
              renderRooms();
              if (state.viewMode === 'chat' && d.roomId === state.activeRoomId) {
                const activeNames = getActiveRoomTypers(d.roomId);
                document.getElementById('typingLbl').textContent = activeNames.length > 0 ? (activeNames.join(', ') + ' 작성중⋯') : '';
              }
            }
          }
        } catch (_) {}
      };
    }

    function syncLukiBtn() {
      const b = document.getElementById('lukiToggleBtn');
      b.textContent = state.invokeLuki ? '🪶 @루키 ON' : '🪶 @루키 부르기';
      b.style.borderColor = state.invokeLuki ? '#10b981' : '';
    }
    document.getElementById('lukiToggleBtn').onclick = () => { state.invokeLuki = !state.invokeLuki; syncLukiBtn(); };

    // 🎙️ 음성 말하기 입력 (Web Speech API)
    (function setupWebVoiceDictation() {
      const micBtn = document.getElementById('micBtn');
      if (!micBtn) return;
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRec) {
        micBtn.onclick = () => alert('이 브라우저는 음성 받아쓰기를 지원하지 않습니다. 키보드의 마이크 단추를 이용해 주세요.');
        return;
      }
      let rec = null;
      let active = false;
      let baseText = '';
      micBtn.onclick = () => {
        const ta = document.getElementById('chatInput');
        if (active && rec) {
          try { rec.stop(); } catch (_) {}
          return;
        }
        rec = new SpeechRec();
        rec.lang = 'ko-KR';
        rec.continuous = true;
        rec.interimResults = true;
        baseText = ta.value ? (ta.value.trimEnd() + ' ') : '';
        active = true;
        micBtn.textContent = '🛑 듣는 중...';
        micBtn.style.borderColor = '#ef4444';
        micBtn.style.color = '#fca5a5';
        rec.onresult = (ev) => {
          let finalPart = '';
          let interimPart = '';
          for (let i = 0; i < ev.results.length; i++) {
            const tr = ev.results[i][0]?.transcript || '';
            if (ev.results[i].isFinal) finalPart += tr + ' ';
            else interimPart += tr;
          }
          ta.value = (baseText + finalPart + interimPart).trimStart();
          ta.dispatchEvent(new Event('input'));
        };
        const finishMic = () => {
          active = false;
          micBtn.textContent = '🎙️ 음성 입력';
          micBtn.style.borderColor = '';
          micBtn.style.color = '';
        };
        rec.onerror = finishMic;
        rec.onend = finishMic;
        try { rec.start(); } catch (_) { finishMic(); }
      };
    })();

    document.getElementById('attachBtn').onclick = () => document.getElementById('filePicker').click();
    document.getElementById('filePicker').onchange = async (ev) => {
      const files = Array.from(ev.target.files || []);
      ev.target.value = '';
      if (!files.length || !state.activeRoomId) return;
      const roomIdAtPick = state.activeRoomId;

      for (const f of files) {
        if ((f.type && f.type.startsWith('video/')) || VIDEO_EXT_RE.test(f.name)) {
          alert('용량 보호를 위해 동영상 파일은 첨부할 수 없습니다.');
          continue;
        }
        if (f.size > 15 * 1024 * 1024) {
          alert('파일 크기는 15MB 이하만 첨부할 수 있습니다: ' + f.name);
          continue;
        }
        state.uploadingCount++;
        renderPendingAtts();
        try {
          const b64 = await new Promise((res, rej) => {
            const rd = new FileReader();
            rd.onload = () => res(String(rd.result).split(',')[1] || '');
            rd.onerror = rej;
            rd.readAsDataURL(f);
          });
          const r = await apiFetch('/table/attachment/upload', {
            method: 'POST',
            body: JSON.stringify({ roomId: roomIdAtPick, fileName: f.name, mimeType: f.type || 'application/octet-stream', dataBase64: b64 })
          });
          const d = await r.json();
          if (!d.ok || !d.attachment) {
            alert(d.error || '첨부 실패');
            continue;
          }
          // Pre-populate local Blob cache so uploaded images appear at 0ms immediately upon send!
          const localUrl = URL.createObjectURL(f);
          attBlobCache.set(roomIdAtPick + ':' + d.attachment.id, {
            url: localUrl,
            blob: f,
            name: d.attachment.name || f.name,
            mimeType: d.attachment.mimeType || f.type || 'application/octet-stream'
          });
          state.pendingAtts.push(d.attachment);
        } catch (err) {
          alert('첨부 업로드 중 오류: ' + (err.message || err));
        } finally {
          state.uploadingCount = Math.max(0, state.uploadingCount - 1);
          renderPendingAtts();
        }
      }
    };

    function renderPendingAtts() {
      const bar = document.getElementById('pendingAttBar');
      const sendBtn = document.getElementById('sendBtn');
      sendBtn.disabled = state.uploadingCount > 0;
      sendBtn.textContent = state.uploadingCount > 0 ? '올리는 중...' : '전송';
      if (state.pendingAtts.length === 0 && state.uploadingCount === 0) {
        bar.style.display = 'none';
        bar.innerHTML = '';
        return;
      }
      bar.style.display = 'flex';
      bar.innerHTML = '';
      if (state.uploadingCount > 0) {
        const up = document.createElement('span');
        up.className = 'att-chip uploading';
        up.textContent = '⏳ 파일 올리는 중 (' + state.uploadingCount + ')...';
        bar.appendChild(up);
      }
      state.pendingAtts.forEach((a, idx) => {
        const sp = document.createElement('span');
        sp.className = 'att-chip';
        sp.textContent = (a.isImage ? '🖼️ ' : '📎 ') + a.name + ' ✕';
        sp.onclick = () => { state.pendingAtts.splice(idx, 1); renderPendingAtts(); };
        bar.appendChild(sp);
      });
    }

    const chatInpEl = document.getElementById('chatInput');
    function stopWebLocalTyping(roomId) {
      if (state.localTypingTimer) { clearTimeout(state.localTypingTimer); state.localTypingTimer = null; }
      if (state.localTypingActiveRoom && (!roomId || state.localTypingActiveRoom === roomId)) {
        const prevR = state.localTypingActiveRoom;
        state.localTypingActiveRoom = '';
        state.lastTypingSentAt = 0;
        const rObj = state.rooms.find(x => x.id === prevR);
        if (rObj && !rObj.isPrivateSolo) {
          sendWsJson({ type: 'typing', roomId: prevR, isTyping: false });
        }
      }
    }
    chatInpEl.addEventListener('input', () => {
      if (!state.activeRoomId) return;
      try {
        if (chatInpEl.value.trim()) localStorage.setItem('lt_draft_' + state.activeRoomId, chatInpEl.value);
        else localStorage.removeItem('lt_draft_' + state.activeRoomId);
      } catch (_) {}
      const hasVal = chatInpEl.value.trim().length > 0;
      const rObj = state.rooms.find(x => x.id === state.activeRoomId);
      if (!hasVal) {
        stopWebLocalTyping(state.activeRoomId);
        return;
      }
      if (rObj && !rObj.isPrivateSolo) {
        const now = Date.now();
        if (state.localTypingActiveRoom !== state.activeRoomId || now - state.lastTypingSentAt >= 2000) {
          state.localTypingActiveRoom = state.activeRoomId;
          state.lastTypingSentAt = now;
          sendWsJson({ type: 'typing', roomId: state.activeRoomId, isTyping: true });
        }
        if (state.localTypingTimer) clearTimeout(state.localTypingTimer);
        state.localTypingTimer = setTimeout(() => stopWebLocalTyping(state.activeRoomId), 3400);
      }
    });
    chatInpEl.addEventListener('blur', () => {
      if (state.activeRoomId) stopWebLocalTyping(state.activeRoomId);
    });

    document.getElementById('sendBtn').onclick = async () => {
      if (state.uploadingCount > 0 || !state.activeRoomId) return;
      const ta = document.getElementById('chatInput');
      const txt = ta.value.trim();
      const attIds = state.pendingAtts.map(a => a.id);
      if (!txt && attIds.length === 0) return;
      const targetRoomId = state.activeRoomId;
      ta.value = '';
      try { localStorage.removeItem('lt_draft_' + targetRoomId); } catch (_) {}
      stopWebLocalTyping(targetRoomId);
      state.pendingAtts = [];
      renderPendingAtts();
      const room = state.rooms.find(r => r.id === targetRoomId);
      const invoke = state.invokeLuki || Boolean(room?.isPrivateSolo);
      if (!room?.isPrivateSolo) { state.invokeLuki = false; syncLukiBtn(); }
      try {
        const recentHistory = invoke && Array.isArray(room?.messages)
          ? room.messages.slice(-20).map(x => ({ id: x.id, senderName: x.senderName, text: x.text, createdAt: x.createdAt }))
          : [];
        let roomArchiveSummary = '';
        try { roomArchiveSummary = localStorage.getItem('lt_room_summary_' + targetRoomId) || ''; } catch (_) {}
        const r = await apiFetch('/table/message', {
          method: 'POST',
          body: JSON.stringify({ roomId: targetRoomId, text: txt, attachmentIds: attIds, invokeLuki: invoke, recentHistory, roomArchiveSummary })
        });
        const d = await r.json().catch(() => null);
        if (d && d.ok && d.message) {
          // Immediately render returned message even if iOS WS dropped while picking photo!
          upsertMessageInRoom(d.message);
          renderRooms();
          if (state.viewMode === 'chat' && state.activeRoomId === targetRoomId) {
            renderMessages(true);
          }
        } else if (d && !d.ok) {
          alert(d.error || '메시지 전송 실패');
        }
      } catch (e) {
        alert('전송 오류: ' + (e.message || e));
      }
    };

    async function enterChatApp() {
      const r = await apiFetch('/table/bootstrap?sinceSeq=0');
      const d = await r.json();
      if (!d.ok) throw new Error(d.error || '세션 만료');
      state.me = d.me;
      loadPinnedRoomsLocal();
      if (Array.isArray(d.pinnedRoomIds)) {
        state.pinnedRoomIds = d.pinnedRoomIds;
        savePinnedRoomsLocal();
      }
      state.familyDirectory = d.familyDirectory || [];
      state.rooms = d.rooms || [];
      for (const rm of state.rooms) {
        try {
          const cachedMsgsRaw = localStorage.getItem('lt_room_msgs_' + rm.id);
          if (cachedMsgsRaw) {
            const cachedArr = JSON.parse(cachedMsgsRaw);
            if (Array.isArray(cachedArr) && cachedArr.length > 0) {
              const curIds = new Set((rm.messages || []).map(x => x.id));
              for (const cm of cachedArr) {
                if (cm && cm.id && !curIds.has(cm.id)) {
                  rm.messages.push(cm);
                  curIds.add(cm.id);
                }
              }
              rm.messages.sort((a, b) => (a.seq || a.createdAt || 0) - (b.seq || b.createdAt || 0));
            }
          }
        } catch (_) {}
        applyReadCursorsToRoom(rm, rm.readCursors);
        if (Array.isArray(rm.activeTypers)) {
          const now = Date.now();
          const map = {};
          for (const tp of rm.activeTypers) {
            if (tp && tp.memberId && tp.memberId !== state.me?.id && tp.expiresAt > now) {
              map[tp.memberId] = { name: tp.memberName || tp.memberId, expiresAt: tp.expiresAt };
            }
          }
          state.roomTypers[rm.id] = map;
        }
        if (rm.activeAssistantStream) {
          const srvText = String(rm.activeAssistantStream.text || '');
          state.liveStreams[rm.id] = {
            msgId: rm.activeAssistantStream.msgId || '',
            phase: rm.activeAssistantStream.phase || (srvText.trim() ? 'writing' : 'thinking'),
            status: rm.activeAssistantStream.status || '루키가 생각을 정리하고 있어요...',
            text: srvText,
            thoughtPreview: String(rm.activeAssistantStream.thoughtPreview || '')
          };
        }
      }
      scheduleWebTyperCleanup();
      if (d.vapidPublicKey) {
        state.vapidPublicKey = d.vapidPublicKey;
        localStorage.setItem('lt_vapid', d.vapidPublicKey);
      }

      document.getElementById('loginScreen').style.display = 'none';
      chatScreenEl.style.display = 'flex';

      const hashM = location.hash.match(/room=([^&]+)/);
      if (hashM && hashM[1]) {
        const targetId = decodeURIComponent(hashM[1]);
        if (state.rooms.find(x => x.id === targetId)) {
          openRoom(targetId);
        } else {
          showRoomList();
        }
      } else {
        // Default screen is ALWAYS the room list!
        showRoomList();
      }

      connectWs();
      if (state.syncTimer) clearInterval(state.syncTimer);
      state.syncTimer = setInterval(() => {
        if (document.visibilityState === 'visible' && state.sessionToken) {
          if (!state.ws || state.ws.readyState > 1) connectWs();
          syncTableStateFromServer(true);
        }
      }, 12000);

      await refreshPushUiState();
      // If user already granted notification permission earlier, silently sync subscription with latest server key
      if (typeof Notification !== 'undefined' && Notification.permission === 'granted' && 'serviceWorker' in navigator && 'PushManager' in window) {
        subscribeTablePush(true, 'granted').catch(() => {});
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (!state.me) return;
      if (document.visibilityState === 'visible') {
        if (!state.ws || state.ws.readyState > 1) connectWs();
        syncTableStateFromServer(true);
        refreshPushUiState();
      } else {
        if (state.activeRoomId) sendWsJson({ type: 'blur_room', roomId: state.activeRoomId });
      }
    });
    window.addEventListener('pageshow', () => {
      if (state.me) {
        if (!state.ws || state.ws.readyState > 1) connectWs();
        syncTableStateFromServer(true);
      }
    });
    window.addEventListener('focus', () => {
      if (state.me) {
        if (!state.ws || state.ws.readyState > 1) connectWs();
        syncTableStateFromServer(true);
      }
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {});
      navigator.serviceWorker.addEventListener('message', (ev) => {
        if (ev.data?.type === 'OPEN_TABLE_ROOM' && ev.data.roomId) {
          openRoom(ev.data.roomId);
          syncTableStateFromServer(true);
        }
      });
    }
    if (state.sessionToken) {
      enterChatApp().catch(() => { localStorage.removeItem('lt_sess'); state.sessionToken = ''; });
    }
  </script>
</body>
