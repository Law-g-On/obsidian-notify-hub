<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="개인 알림함">
  <meta name="theme-color" content="#0b0d13">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon.svg">
  <title>🔔 옵시디언 개인 알림함</title>
  <style>
    :root { --bg:#0b0d13; --card:#161b26; --border:rgba(255,255,255,0.09); --accent:#10b981; --amber:#f59e0b; --text:#f8fafc; --muted:#94a3b8; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif; background:var(--bg); color:var(--text); margin:0; padding:calc(env(safe-area-inset-top,16px) + 12px) 16px 40px 16px; max-width:520px; margin-inline:auto; }
    .hdr { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:14px; }
    .hdr h1 { font-size:18px; margin:0; }
    .hdr-actions { display:flex; gap:6px; align-items:center; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:18px; padding:16px; margin-bottom:12px; }
    .btn { background:var(--accent); color:#042f2e; font-weight:800; border:none; border-radius:12px; padding:13px 16px; font-size:14.5px; cursor:pointer; width:100%; display:inline-flex; justify-content:center; align-items:center; gap:6px; text-decoration:none; }
    .btn.amber { background:var(--amber); color:#291502; }
    .btn-sec { background:rgba(255,255,255,0.07); color:var(--text); font-weight:600; border:1px solid var(--border); border-radius:9px; padding:8px 11px; font-size:12.5px; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; }
    .code-box { width:100%; font-family:ui-monospace,Menlo,monospace; font-size:11px; background:#090b10; border:1px solid var(--border); border-radius:10px; padding:10px; color:#34d399; margin:10px 0 8px 0; height:84px; resize:none; }
    .btn-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
    .item { border-bottom:1px solid var(--border); padding:13px 0; cursor:pointer; }
    .item:last-child { border-bottom:none; }
    .item.featured { background:rgba(16,185,129,0.08); border:1px solid rgba(52,211,153,0.32); border-radius:14px; padding:14px; margin-bottom:10px; }
    .item.featured.is-approval { background:rgba(245,158,11,0.11); border-color:rgba(245,158,11,0.45); }
    .meta { font-size:11.5px; color:var(--muted); display:flex; justify-content:space-between; margin-bottom:5px; }
    .badge { color:#34d399; font-weight:700; }
    .badge.amber { color:#fbbf24; }
    .title { font-size:15px; font-weight:700; margin-bottom:5px; line-height:1.35; }
    .body { font-size:13.5px; color:#cbd5e1; line-height:1.5; white-space:pre-wrap; }
    .cta-wrap { margin-top:12px; display:flex; flex-direction:column; gap:8px; }
    .hint { font-size:12.5px; color:var(--muted); line-height:1.5; margin:0 0 10px 0; }
  </style>
</head>
<body>
  <div class="hdr">
    <h1>🔔 개인 알림함</h1>
    <div class="hdr-actions">
      <button class="btn-sec" id="toggleSetupBtn">⚙️ 기기 연결</button>
      <button class="btn-sec" id="clearAllBtn">비우기</button>
    </div>
  </div>

  <div class="card" id="setupCard" style="display:none;">
    <p class="hint" id="setupHint">1. 사파리/크롬 공유 메뉴에서 <strong>홈 화면에 추가</strong>한 뒤 바탕화면 아이콘으로 여세요.<br>2. 아래 단추로 연결 코드를 발급받은 뒤 <strong>원터치 자동 등록</strong> 또는 <strong>복사·AirDrop</strong>으로 옵시디언에 연결하세요.</p>
    <button class="btn" id="pairBtn">🔐 알림 켜기 및 기기 연결 코드 발급</button>
    <div id="codeWrap" style="display:none;">
      <textarea class="code-box" id="pairCodeBox" readonly onclick="this.focus();this.select();"></textarea>
      <button class="btn" id="oneTapObsBtn" style="margin-bottom:8px;">📲 이 기기의 옵시디언에 원터치 자동 등록</button>
      <div class="btn-grid">
        <button class="btn-sec" id="copyCodeBtn">📋 연결 코드 복사</button>
        <button class="btn-sec" id="shareCodeBtn">📤 AirDrop·공유 전송</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <strong style="font-size:14px;">최근 도착한 개인 알림 (카드를 누르면 바로 그 대화창으로 이동)</strong>
      <span id="countLbl" style="font-size:12px;color:#94a3b8;">0건</span>
    </div>
    <div id="listBox"><p class="hint" style="margin:8px 0;">아직 도착한 알림이 없습니다.</p></div>
  </div>

  <script>
    const DB_NAME = 'obsidian_personal_notify_db';
    const STORE = 'items';
    let focusedItemId = '';
    let pendingAutoLaunch = false;

    function readFocusHash() {
      const h = String(location.hash || '');
      const m = h.match(/focus=([^&]+)/);
      focusedItemId = m ? decodeURIComponent(m[1]) : '';
      if (h.includes('autolaunch=1')) {
        pendingAutoLaunch = true;
        try { history.replaceState(null, '', location.pathname + (focusedItemId ? '#focus=' + encodeURIComponent(focusedItemId) : '')); } catch (_) {}
      }
    }
    readFocusHash();
    window.addEventListener('hashchange', () => { readFocusHash(); renderItems(); });

    function isChatNotificationItem(it) {
      const ak = String(it.actionKind || '');
      const ch = String(it.channel || '');
      const np = String(it.notePath || '');
      if (ak === 'luki-chat' || ak === 'approval') return true;
      if (ch.includes('루키') && !ch.includes('식탁')) return true;
      if (np.includes('/대화록/') || np.startsWith('대화록/') || /시\s*\d+분부로 시작한 대화/.test(np)) return true;
      return false;
    }

    function isTableNotificationItem(it) {
      const ak = String(it.actionKind || '');
      const ch = String(it.channel || '');
      const np = String(it.notePath || '');
      return ak === 'luki-table' || Boolean(it.roomId) || ch.includes('식탁') || np.includes('루키의 식탁/');
    }

    function buildObsidianDeepLink(it) {
      if (isTableNotificationItem(it)) {
        const qp = [];
        if (it.vault) qp.push('vault=' + encodeURIComponent(it.vault));
        if (it.roomId) qp.push('room=' + encodeURIComponent(it.roomId));
        if (it.msgId) qp.push('msg=' + encodeURIComponent(it.msgId));
        if (it.notePath) qp.push('note=' + encodeURIComponent(it.notePath));
        return 'obsidian://luki-table' + (qp.length ? ('?' + qp.join('&')) : '');
      }
      if (isChatNotificationItem(it) || it.notePath || it.actionKind === 'approval') {
        const qp = [];
        if (it.vault) qp.push('vault=' + encodeURIComponent(it.vault));
        if (it.actionKind) qp.push('actionKind=' + encodeURIComponent(it.actionKind));
        else if (isChatNotificationItem(it)) qp.push('actionKind=luki-chat');
        if (it.channel) qp.push('channel=' + encodeURIComponent(it.channel));
        if (it.notePath) qp.push('note=' + encodeURIComponent(it.notePath));
        return 'obsidian://notify-hub-open' + (qp.length ? ('?' + qp.join('&')) : '');
      }
      return it.vault ? ('obsidian://open?vault=' + encodeURIComponent(it.vault)) : 'obsidian://open';
    }

    function b64uEncode(bytes) {
      let bin = '';
      const u8 = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
      for (let i = 0; i < u8.length; i++) bin += String.fromCharCode(u8[i]);
      return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
    }
    function b64uDecode(str) {
      const s = str.replace(/-/g, '+').replace(/_/g, '/');
      const pad = s.length % 4 === 0 ? '' : '='.repeat(4 - (s.length % 4));
      const bin = atob(s + pad);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }

    async function copyTextBulletproof(text) {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch (_) {}
      try {
        const box = document.getElementById('pairCodeBox');
        box.value = text;
        box.focus();
        box.select();
        box.setSelectionRange(0, text.length);
        return document.execCommand('copy');
      } catch (_) {
        return false;
      }
    }

    async function getOrCreateLocalVapidKeys() {
      const saved = localStorage.getItem('onh_vapid_v1');
      if (saved) {
        try { return JSON.parse(saved); } catch (_) {}
      }
      const kp = await crypto.subtle.generateKey({ name: 'ECDSA', namedCurve: 'P-256' }, true, ['sign', 'verify']);
      const jwk = await crypto.subtle.exportKey('jwk', kp.privateKey);
      const x = b64uDecode(jwk.x);
      const y = b64uDecode(jwk.y);
      const pubUncompressed = new Uint8Array(65);
      pubUncompressed[0] = 0x04;
      pubUncompressed.set(x, 1);
      pubUncompressed.set(y, 33);
      const keys = { publicKey: b64uEncode(pubUncompressed), privateKey: jwk.d };
      localStorage.setItem('onh_vapid_v1', JSON.stringify(keys));
      return keys;
    }

    async function openDb() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, { keyPath: 'id' });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function renderItems() {
      const db = await openDb();
      const items = await new Promise((res) => {
        const tx = db.transaction(STORE, 'readonly');
        const req = tx.objectStore(STORE).getAll();
        req.onsuccess = () => res(req.result || []);
        req.onerror = () => res([]);
      });
      items.sort((a, b) => (b.ts || 0) - (a.ts || 0));
      if (focusedItemId && focusedItemId !== 'latest') {
        const fIdx = items.findIndex(x => x.id === focusedItemId);
        if (fIdx > 0) {
          const [picked] = items.splice(fIdx, 1);
          items.unshift(picked);
        }
      }
      document.getElementById('countLbl').textContent = items.length + '건';
      const box = document.getElementById('listBox');
      if (items.length === 0) {
        box.innerHTML = '<p class="hint" style="margin:8px 0;">아직 도착한 알림이 없습니다.</p>'
          + '<a class="btn-sec" href="obsidian://open" style="width:100%;margin-top:6px;">📲 옵시디언 바로 열기</a>';
        return;
      }
      box.innerHTML = '';

      if (pendingAutoLaunch && items[0]) {
        pendingAutoLaunch = false;
        const autoHref = buildObsidianDeepLink(items[0]);
        setTimeout(() => { try { window.location.href = autoHref; } catch (_) {} }, 60);
      }

      items.forEach((it, idx) => {
        const isTop = idx === 0;
        const isApproval = it.actionKind === 'approval' || String(it.channel || '').includes('승인') || String(it.title || '').includes('승인');
        const isTable = isTableNotificationItem(it);
        const isChat = !isTable && isChatNotificationItem(it);
        const div = document.createElement('div');
        div.className = 'item' + (isTop ? ' featured' : '') + (isApproval ? ' is-approval' : '');

        const timeStr = new Date(it.ts || Date.now()).toLocaleString('ko-KR', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' });
        const meta = document.createElement('div');
        meta.className = 'meta';
        const ch = document.createElement('span');
        ch.className = 'badge' + (isApproval ? ' amber' : '');
        ch.textContent = it.channel || '개인 알림';
        const tm = document.createElement('span');
        tm.textContent = timeStr;
        meta.append(ch, tm);

        const tt = document.createElement('div');
        tt.className = 'title';
        tt.textContent = it.title || '알림';

        const bd = document.createElement('div');
        bd.className = 'body';
        bd.textContent = it.body || '';

        div.append(meta, tt, bd);

        const deepHref = buildObsidianDeepLink(it);
        const ctaWrap = document.createElement('div');
        ctaWrap.className = 'cta-wrap';

        const openLink = document.createElement('a');
        openLink.href = deepHref;
        let mainLabel = '📲 옵시디언 바로 열기';
        if (isApproval) {
          mainLabel = '🔐 옵시디언 바로 그 대화창으로 돌아가 승인하기';
        } else if (isTable) {
          mainLabel = '🍽️ 옵시디언의 바로 그 식탁 대화창 열기';
        } else if (isChat) {
          mainLabel = '💬 옵시디언의 바로 그 루키 대화창 열기';
        } else if (it.notePath) {
          mainLabel = '📖 옵시디언에서 해당 노트 바로 열기';
        }

        if (isTop) {
          openLink.className = 'btn' + (isApproval ? ' amber' : '');
          openLink.textContent = mainLabel;
        } else {
          openLink.className = 'btn-sec';
          openLink.style.width = '100%';
          openLink.textContent = mainLabel;
        }
        openLink.onclick = (ev) => ev.stopPropagation();
        ctaWrap.appendChild(openLink);

        if (isTable) {
          const tableWebLink = document.createElement('a');
          tableWebLink.href = '../table/' + (it.roomId ? ('#room=' + encodeURIComponent(it.roomId)) : '');
          tableWebLink.className = 'btn-sec';
          tableWebLink.style.width = '100%';
          tableWebLink.textContent = '📱 모바일 식탁 웹앱 대화창으로 열기';
          tableWebLink.onclick = (ev) => ev.stopPropagation();
          ctaWrap.appendChild(tableWebLink);
        }

        div.onclick = () => { window.location.href = deepHref; };
        div.appendChild(ctaWrap);
        box.appendChild(div);
      });
    }

    const setupCard = document.getElementById('setupCard');
    document.getElementById('toggleSetupBtn').onclick = () => {
      const hidden = setupCard.style.display === 'none';
      setupCard.style.display = hidden ? 'block' : 'none';
    };

    document.getElementById('clearAllBtn').onclick = async () => {
      const db = await openDb();
      await new Promise((res) => {
        const tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).clear();
        tx.oncomplete = () => res();
      });
      renderItems();
    };

    let latestPairingCode = localStorage.getItem('onh_pairing_code') || '';
    if (latestPairingCode) {
      document.getElementById('pairCodeBox').value = latestPairingCode;
      document.getElementById('codeWrap').style.display = 'block';
      setupCard.style.display = 'none';
    } else {
      setupCard.style.display = 'block';
    }

    document.getElementById('pairBtn').onclick = async () => {
      try {
        if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
          alert('이 화면을 먼저 홈 화면에 추가한 뒤 바탕화면 아이콘으로 열어 주세요 (iOS 16.4+ / Android 지원).');
          return;
        }
        const reg = await navigator.serviceWorker.register('./sw.js', { scope: './' });
        await navigator.serviceWorker.ready;
        const perm = await Notification.requestPermission();
        if (perm !== 'granted') {
          alert('알림 권한을 허용해 주셔야 잠금화면 알림을 받을 수 있습니다.');
          return;
        }
        const vapid = await getOrCreateLocalVapidKeys();
        let sub = await reg.pushManager.getSubscription();
        if (sub) {
          try { await sub.unsubscribe(); } catch (_) {}
        }
        sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: b64uDecode(vapid.publicKey)
        });
        const bundle = {
          v: 1,
          label: (navigator.platform || '모바일') + ' 개인알림',
          subscription: sub.toJSON(),
          vapid
        };
        latestPairingCode = 'ONH1:' + b64uEncode(new TextEncoder().encode(JSON.stringify(bundle)));
        localStorage.setItem('onh_pairing_code', latestPairingCode);
        document.getElementById('pairCodeBox').value = latestPairingCode;
        document.getElementById('codeWrap').style.display = 'block';
        await copyTextBulletproof(latestPairingCode);
      } catch (e) {
        alert('코드 발급 오류: ' + (e.message || e));
      }
    };

    document.getElementById('oneTapObsBtn').onclick = async () => {
      if (!latestPairingCode) return;
      await copyTextBulletproof(latestPairingCode);
      window.location.href = 'obsidian://notify-hub-pair?code=' + encodeURIComponent(latestPairingCode);
    };

    document.getElementById('copyCodeBtn').onclick = async () => {
      if (!latestPairingCode) return;
      const ok = await copyTextBulletproof(latestPairingCode);
      const btn = document.getElementById('copyCodeBtn');
      btn.textContent = ok ? '✅ 복사 완료!' : '위 상자를 길게 눌러 복사';
      setTimeout(() => { btn.textContent = '📋 연결 코드 복사'; }, 2000);
    };

    document.getElementById('shareCodeBtn').onclick = async () => {
      if (!latestPairingCode) return;
      if (navigator.share) {
        try { await navigator.share({ text: latestPairingCode }); return; } catch (_) {}
      }
      await copyTextBulletproof(latestPairingCode);
      alert('연결 코드를 클립보드에 복사했습니다.');
    };

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {});
      navigator.serviceWorker.addEventListener('message', (ev) => {
        if (ev.data?.type === 'FOCUS_ITEM') {
          focusedItemId = ev.data.item?.id || 'latest';
          pendingAutoLaunch = Boolean(ev.data.autolaunch);
          renderItems();
        } else if (ev.data?.type === 'NEW_PERSONAL_NOTIFY') {
          renderItems();
        }
      });
    }
    renderItems();
  </script>
</body>
</html>
