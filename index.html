<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>루키 알림함 &amp; 식탁 포털</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; background: #0b0d13; color: #f8fafc; margin: 0; padding: 32px 18px; max-width: 480px; margin-inline: auto; }
    h1 { font-size: 20px; margin-bottom: 8px; }
    p { font-size: 13.5px; color: #94a3b8; line-height: 1.55; }
    .card { display: block; text-decoration: none; color: inherit; background: #161b26; border: 1px solid rgba(255,255,255,0.1); border-radius: 18px; padding: 18px; margin-top: 14px; }
    .card strong { display: block; font-size: 16px; color: #34d399; margin-bottom: 5px; }
  </style>
</head>
<body>
  <h1>🪶 루키 웹앱 포털</h1>
  <p>원하시는 창구를 선택해 스마트폰이나 컴퓨터 브라우저에서 연 뒤 <strong>홈 화면(또는 독)에 추가</strong>하여 전용 앱처럼 사용하세요. 모든 알림과 대화는 기기와 본인 서버 사이에서만 종단간 암호화되어 오갑니다.</p>
  <a class="card" href="./notify/">
    <strong>🪶 루키 알림함 (/notify/)</strong>
    <p style="margin:0;">내 옵시디언 볼트의 루키 응답·보안 승인·리마인더 알림을 직통으로 받고 상단 고정·슬라이드 정리하는 전용 알림함입니다.</p>
  </a>
  <a class="card" href="./table/">
    <strong>🍽️ 루키의 식탁 (/table/)</strong>
    <p style="margin:0;">입장 코드와 개인 비밀번호(PIN)로 로그인해 내가 참여 중인 대화방의 새 톡 알림과 실시간 대화를 나누는 창구입니다.</p>
  </a>
</body>
</html>
